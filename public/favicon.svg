<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="onedesk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#onedesk-grad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Icon: Graduation Cap & Smart Desk Layer -->
  <g filter="url(#shadow)">
    <!-- Mortarboard Top Diamond -->
    <path d="M32 14L52 23.5L32 33L12 23.5L32 14Z" fill="#FFFFFF"/>
    
    <!-- Cap Base / Skullcap -->
    <path d="M19 28.5V36.5C19 41.5 24.8 45.5 32 45.5C39.2 45.5 45 41.5 45 36.5V28.5L32 34.5L19 28.5Z" fill="#FFFFFF" fill-opacity="0.9"/>
    
    <!-- Tassel and Ribbon -->
    <path d="M48 24.5V37.5C48 38.6 47.1 39.5 46 39.5C44.9 39.5 44 38.6 44 37.5V26.5" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="24.5" r="1.5" fill="#FBBF24"/>
    
    <!-- Desk / Platform Foundation Line -->
    <path d="M16 49C20.5 50.8 26 51.8 32 51.8C38 51.8 43.5 50.8 48 49" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
